<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Desk — Sales Operations</title>
<meta name="description" content="Local sales operations desk for medical & surgical consumables sales — inbox, follow-ups, orders, quotations, delivery & payment tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F4;
  --card:#FFFFFF;
  --ink:#12221F;
  --ink-2:#4B5F5A;
  --ink-3:#8A9C97;
  --line:#DDE6E2;
  --line-2:#ECF1EF;
  --accent:#0F7C6C;
  --accent-dark:#0B5F53;
  --accent-tint:#E4F2EF;
  --urgent:#DC2626;
  --urgent-tint:#FDECEC;
  --warm:#D97706;
  --warm-tint:#FCF1DE;
  --cold:#2563EB;
  --cold-tint:#E9F0FE;
  --ok:#16A34A;
  --ok-tint:#E9F8EE;
  --radius:14px;
  --shadow:0 1px 2px rgba(18,34,31,.05), 0 8px 22px rgba(18,34,31,.06);
  --sidebar-w:230px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Space Grotesk",-apple-system,sans-serif;margin:0;letter-spacing:-.01em;color:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
code,.mono{font-family:"IBM Plex Mono",monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CFDAD6;border-radius:8px}
button{cursor:pointer}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:none;background:var(--ink);color:#EAF3F0;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 20px}
.brand .mk{width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,var(--accent),#4FD3B8);flex:none}
.brand b{font-family:"Space Grotesk";font-weight:700;font-size:15.5px;display:block;line-height:1.1}
.brand span{font-size:10.5px;color:#9FC2BB;letter-spacing:.08em;text-transform:uppercase}
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;flex:1}
.navlist button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  color:#C9DFDA;padding:10px 10px;border-radius:10px;font-size:13.5px;font-weight:500;
}
.navlist button .ix{font-family:"IBM Plex Mono";font-size:10.5px;color:#6E948C;width:16px;flex:none}
.navlist button:hover{background:rgba(255,255,255,.06);color:#fff}
.navlist button.on{background:var(--accent);color:#fff}
.navlist button.on .ix{color:#CFF3EB}
.sidefoot{padding-top:10px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px}
.sidefoot button{background:rgba(255,255,255,.07);border:0;color:#EAF3F0;border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:600;text-align:left}
.sidefoot button:hover{background:rgba(255,255,255,.13)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(242,245,244,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;
}
.topbar h1{font-size:19px}
.topbar .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.gsearch{flex:1;max-width:420px;margin-left:auto;position:relative}
.gsearch input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px}
.gsearch input:focus{border-color:var(--accent);outline:none}
.gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.qc-btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;white-space:nowrap}
.qc-btn:hover{background:var(--accent-dark)}

.content{padding:20px 22px 90px;max-width:1280px;width:100%;margin:0 auto}

/* ---------- cards / grid ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);cursor:pointer}
.stat:hover{border-color:var(--accent)}
.stat .n{font-family:"Space Grotesk";font-size:24px;font-weight:700;line-height:1}
.stat .l{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-weight:600;letter-spacing:.01em}
.stat.urgent .n{color:var(--urgent)}
.stat.warm .n{color:var(--warm)}
.stat.ok .n{color:var(--accent)}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-h h2{font-size:16px}
.section-h .cnt{font-size:12px;color:var(--ink-3)}

.overdue-banner{background:var(--urgent-tint);border:1px solid #F7C9C9;color:#8B1E1E;border-radius:12px;padding:11px 15px;font-weight:600;font-size:13.5px;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* ---------- action / list card ---------- */
.alist{display:flex;flex-direction:column;gap:8px}
.acard{
  background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:12px 14px 12px 14px;display:flex;gap:12px;position:relative;overflow:hidden;
}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--p,var(--ink-3))}
.acard.pri-urgent::before{background:var(--urgent)}
.acard.pri-normal::before{background:var(--warm)}
.acard.pri-low::before{background:var(--cold)}
.acard .abody{flex:1;min-width:0;padding-left:8px}
.acard .arow1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.acard .cust{font-weight:700;font-size:14.5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:3px 8px}
.badge.b-urgent{background:var(--urgent-tint);color:var(--urgent)}
.badge.b-normal{background:var(--warm-tint);color:var(--warm)}
.badge.b-low{background:var(--cold-tint);color:var(--cold)}
.badge.b-status{background:var(--line-2);color:var(--ink-2)}
.badge.b-new{background:var(--cold-tint);color:var(--cold)}
.badge.b-action{background:var(--warm-tint);color:var(--warm)}
.badge.b-processing{background:#EFEAFB;color:#6D3FD1}
.badge.b-waiting{background:var(--line-2);color:var(--ink-2)}
.badge.b-completed{background:var(--ok-tint);color:var(--ok)}
.badge.b-cancelled{background:#F3F3F3;color:#9A9A9A}
.badge.b-overdue{background:var(--urgent);color:#fff}
.acard .msg{font-size:13.5px;color:var(--ink-2);margin:2px 0 6px;overflow-wrap:anywhere}
.acard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.acard .meta b{color:var(--ink-2);font-weight:600}
.acard .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink-2)}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.mini.pri:hover{background:var(--accent-dark)}
.mini.ghost-red{color:var(--urgent);border-color:#F3CACA}
.mini.ghost-red:hover{background:var(--urgent-tint)}

.empty{text-align:center;padding:44px 20px;color:var(--ink-3);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty b{color:var(--ink-2)}

/* ---------- filter chips / tabs ---------- */
.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search],.toolbar select{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:13px}
.toolbar .spacer{flex:1}
.btn{border:0;border-radius:10px;padding:9px 15px;font-weight:600;font-size:13px;background:var(--ink);color:#fff}
.btn:hover{background:#0A1613}
.btn.acc{background:var(--accent)}
.btn.acc:hover{background:var(--accent-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}

/* ---------- table ---------- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);background:var(--line-2);padding:9px 12px;font-weight:700;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line-2);vertical-align:top}
tr:hover td{background:#FAFCFB}
.rowbtns{display:flex;gap:5px}
@media(max-width:900px){.tblwrap{display:none}}
.cardlist{display:none;flex-direction:column;gap:8px}
@media(max-width:900px){.cardlist{display:flex}}
.reccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.reccard .t1{font-weight:700;font-size:14px}
.reccard .t2{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.reccard .rowmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.reccard .btns{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,34,31,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{
  position:fixed;z-index:95;left:50%;top:50%;transform:translate(-50%,-46%);width:min(560px,92vw);
  max-height:88vh;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:.18s;
}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:16.5px;flex:1}
.modal-h .x{border:0;background:var(--line-2);border-radius:8px;width:30px;height:30px;font-size:16px;color:var(--ink-2)}
.modal-b{padding:16px 18px;overflow-y:auto;flex:1}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.frow{display:grid;gap:5px;margin-bottom:12px}
.frow label{font-size:12px;font-weight:700;color:var(--ink-2)}
.frow input,.frow select,.frow textarea{padding:10px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;background:#fff;width:100%}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent);outline:none}
.frow textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pillpick{display:flex;gap:6px;flex-wrap:wrap}
.pillpick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pillpick button.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.pillpick button.sel.u{background:var(--urgent);border-color:var(--urgent)}
.pillpick button.sel.w{background:var(--warm);border-color:var(--warm)}
.pillpick button.sel.c{background:var(--cold);border-color:var(--cold)}
details.more{margin-top:6px}
details.more summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";}
details.more[open] summary::before{content:"− ";}
.autoc{position:relative}
.autoc-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:180px;overflow-y:auto;z-index:5;margin-top:4px}
.autoc-list div{padding:8px 11px;font-size:13px;cursor:pointer}
.autoc-list div:hover{background:var(--accent-tint)}

/* ---------- customer timeline ---------- */
.timeline{display:flex;flex-direction:column;gap:0;margin-top:8px}
.tl-item{display:flex;gap:10px;padding:9px 0;border-left:2px solid var(--line);padding-left:14px;margin-left:5px;position:relative}
.tl-item::before{content:"";position:absolute;left:-6px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tl-item .d{font-size:11px;color:var(--ink-3);white-space:nowrap;font-family:"IBM Plex Mono"}
.tl-item .t{font-size:13px;color:var(--ink)}

/* ---------- toast / fab ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;right:18px;bottom:78px;z-index:60;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;border:0;box-shadow:0 10px 24px rgba(15,124,108,.4);display:none;align-items:center;justify-content:center}
@media(max-width:860px){.fab{display:flex}}

/* ---------- mobile nav ---------- */
.sidebar{display:flex}
.bottomnav{display:none}
@media(max-width:860px){
  .sidebar{display:none}
  .bottomnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
  }
  .bottomnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-3);font-size:10.5px;font-weight:600;padding:6px 4px;flex:1}
  .bottomnav button .dot{width:6px;height:6px;border-radius:50%;background:transparent}
  .bottomnav button.on{color:var(--accent)}
  .bottomnav button.on .dot{background:var(--accent)}
  body{padding-bottom:64px}
  .topbar{padding:10px 14px}
  .content{padding:14px 14px 90px}
  .two,.three{grid-template-columns:1fr}
}
.morelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.morelist button{width:100%;text-align:left;background:var(--line-2);border:0;padding:12px 14px;border-radius:10px;font-weight:600;font-size:14px}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mk"></div>
      <div><b>Field Desk</b><span>Sales Operations</span></div>
    </div>
    <ul class="navlist" id="navlist"></ul>
    <div class="sidefoot">
      <button id="btnExportJSON">⬇ Export backup (JSON)</button>
      <button id="btnImportJSON">⬆ Import backup</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Today</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="gsearch">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="globalSearch" type="search" placeholder="Search customer, phone, product, order, quote…">
      </div>
      <button class="qc-btn" id="btnQuickCaptureTop">+ Quick Capture</button>
    </header>
    <main class="content" id="app"></main>
  </div>
</div>

<nav class="bottomnav" id="bottomnav"></nav>
<button class="fab" id="fabCapture" aria-label="Quick capture">+</button>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   FIELD DESK — local sales operations app (localStorage, no backend)
   ========================================================================= */
const STORE_KEY = "fielddesk_v1";
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = (p)=> p+"-"+Math.random().toString(36).slice(2,7).toUpperCase()+Date.now().toString(36).slice(-3).toUpperCase();
const todayISO = ()=> new Date().toISOString().slice(0,10);
const nowHM = ()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtDate = iso => { if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso; return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
const fmtDateShort = iso => { if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return iso; return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}); };
const money = n => (n===""||n===null||n===undefined||isNaN(n)) ? "—" : "AED "+Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
const isOverdue = (dueDate,dueTime)=>{
  if(!dueDate) return false;
  const now = new Date();
  const due = new Date(dueDate + "T" + (dueTime || "23:59") + ":00");
  return due < now;
};
const isToday = iso => iso === todayISO();

/* ---------------- data layer ---------------- */
function blankDB(){
  return { customers:[], inbox:[], orders:[], quotations:[], followups:[], activities:[], meta:{ salesExec:"Sales Executive" } };
}
let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return seedDB();
    const d = JSON.parse(raw);
    return Object.assign(blankDB(), d);
  }catch(e){ console.error("Load failed", e); return blankDB(); }
}
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function seedDB(){
  const d = blankDB();
  const c1 = { id: uid("CUS"), name:"Al Noor Medical Centre", type:"Medical Centre", location:"Deira, Dubai", area:"Deira",
    contactPerson:"Dr. Salma Haddad", designation:"Procurement Lead", phone:"0501234567", whatsapp:"0501234567", email:"",
    purchaseContact:"", accountsContact:"", doctor:"", existingSupplier:"", productsUsed:"Gloves, Sutures, Dressings",
    potential:"HOT", paymentBehaviour:"Good", lastVisit:"", lastOrder:"", nextFollowup:"", notes:"", createdAt:Date.now(),
    timeline:[{date:todayISO(),type:"First contact",text:"Introduced product range"}] };
  d.customers.push(c1);
  d.inbox.push({ id: uid("INB"), customerId:c1.id, customerName:c1.name, phone:c1.phone, source:"WhatsApp",
    message:"Need 10 boxes surgical gloves and 5 boxes syringes.", type:"New Order", priority:"Urgent",
    nextAction:"Check stock", dueDate:todayISO(), dueTime:"11:00", status:"NEW", createdAt:Date.now(), convertedTo:null });
  return d;
}

/* ---------------- constants ---------------- */
const INBOX_TYPES = ["New Order","Price Request","Quotation","Follow-up","Delivery","Payment","Product Enquiry","Complaint","General","Lead"];
const NEXT_ACTIONS = ["Check stock","Prepare quotation","Send quotation","Call customer","WhatsApp customer","Confirm order","Arrange delivery","Verify payment","Visit customer","Send catalogue","Send product details","Request approval","Other"];
const INBOX_STATUS = ["NEW","ACTION REQUIRED","PROCESSING","WAITING","COMPLETED","CANCELLED"];
const ORDER_STATUS = ["NEW ORDER","STOCK CHECK","CUSTOMER CONFIRMED","ORDER PROCESSING","DISPATCHED","DELIVERED","PAYMENT PENDING","COMPLETED","CANCELLED"];
const QUOTE_STATUS = ["PRICE REQUEST","PREPARING","QUOTATION SENT","WAITING CUSTOMER","NEGOTIATION","WON","LOST"];
const DELIVERY_STATUS = ["Pending","Preparing","Dispatched","Out for Delivery","Delivered","Delivery Issue"];
const PAYMENT_STATUS = ["Not Due","Payment Pending","Payment Claimed","Verification Pending","Verified","Overdue","Completed"];
const RELATIONSHIP = ["NEW","CONTACTED","VISITED","REQUIREMENT IDENTIFIED","QUOTATION SENT","NEGOTIATION","CUSTOMER","REPEAT CUSTOMER","LOST"];
const FACILITY_TYPES = ["Hospital","Medical Centre","Clinic","Dental Clinic","Pharmacy","Laboratory","Aesthetic Clinic","Other"];
const FOLLOWUP_ACTIONS = ["Call","WhatsApp","Visit","Send quotation","Send catalogue","Send product information","Check requirement","Ask for order","Other"];
const ACTIVITY_TYPES = ["Customer Visit","Phone Call","WhatsApp Conversation","Quotation","Order","Delivery","Payment","New Lead","Follow-up"];

const NAV = [

/* ---------------- toast ---------------- */
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2200);
}

/* ---------------- helpers: phone / wa ---------------- */
function waDigits(phone){
  let p = (phone||"").replace(/\D/g,"");
  if(!p) return "";
  if(p.startsWith("00")) p = p.slice(2);
  if(p.startsWith("0")) p = "971"+p.slice(1);
  if(!p.startsWith("971") && p.length<=10) p = "971"+p;
  return p;
}
function waLink(phone, text){
  const d = waDigits(phone);
  if(!d) return null;
  return "https://wa.me/"+d+(text? "?text="+encodeURIComponent(text) : "");
}
function telLink(phone){ const p=(phone||"").replace(/[^\d+]/g,""); return p? "tel:"+p : null; }

/* ---------------- customer helpers ---------------- */
function findOrCreateCustomer({name, phone}){
  name = (name||"").trim();
  if(!name) return null;
  let existing = DB.customers.find(c => c.name.trim().toLowerCase() === name.toLowerCase() ||
    (phone && c.phone && c.phone.replace(/\D/g,"") === phone.replace(/\D/g,"") && c.phone.replace(/\D/g,"").length>5));
  if(existing) return existing;
  const c = { id:uid("CUS"), name, type:"Medical Centre", location:"", area:"", contactPerson:"", designation:"",
    phone: phone||"", whatsapp: phone||"", email:"", purchaseContact:"", accountsContact:"", doctor:"",
    existingSupplier:"", productsUsed:"", potential:"WARM", paymentBehaviour:"", lastVisit:"", lastOrder:"",
    nextFollowup:"", notes:"", createdAt:Date.now(), timeline:[{date:todayISO(),type:"First contact",text:"Customer created"}] };
  DB.customers.push(c);
  return c;
}
function addTimeline(customerId, type, text){
  const c = DB.customers.find(x=>x.id===customerId);
  if(!c) return;
  c.timeline = c.timeline || [];
  c.timeline.unshift({date:todayISO(), type, text});
}
function customerById(id){ return DB.customers.find(c=>c.id===id); }

/* ---------------- unified action queue (dashboard) ---------------- */
function buildActionQueue(){
  const actions = [];
  DB.inbox.forEach(i=>{
    if(i.status==="COMPLETED"||i.status==="CANCELLED") return;
    actions.push({ kind:"inbox", id:i.id, customer:i.customerName, text:i.nextAction||i.type, reason:i.message,
      dueDate:i.dueDate, dueTime:i.dueTime, source:i.source, priority:i.priority, status:i.status, ref:i });
  });
  DB.followups.forEach(f=>{
    if(f.status==="COMPLETED"||f.status==="CANCELLED") return;
    actions.push({ kind:"followup", id:f.id, customer:f.customerName, text:f.nextAction||"Follow up", reason:f.requirement,
      dueDate:f.dueDate, dueTime:f.dueTime, source:"CRM", priority: f.potential==="HOT"?"Urgent":(f.potential==="WARM"?"Normal":"Low"), status:f.status||"ACTION REQUIRED", ref:f });
  });
  return actions;
}
function sortActions(list, by){
  const pOrder = {Urgent:0, Normal:1, Low:2};
  const arr = [...list];
  if(by==="priority") arr.sort((a,b)=> (pOrder[a.priority]??3)-(pOrder[b.priority]??3) || cmpDue(a,b));
  else if(by==="customer") arr.sort((a,b)=> a.customer.localeCompare(b.customer));
  else if(by==="type") arr.sort((a,b)=> a.kind.localeCompare(b.kind));
  else arr.sort(cmpDue);
  return arr;
}
function cmpDue(a,b){
  const da = a.dueDate? a.dueDate+"T"+(a.dueTime||"23:59") : "9999";
  const db = b.dueDate? b.dueDate+"T"+(b.dueTime||"23:59") : "9999";
  return da.localeCompare(db);
}

/* ---------------- priority / status badge render ---------------- */
function priBadge(p){
  const cls = p==="Urgent"?"b-urgent":(p==="Normal"?"b-normal":"b-low");
  const ic = p==="Urgent"?"🔴":(p==="Normal"?"🟡":"🟢");
  return `<span class="badge ${cls}">${ic} ${esc(p)}</span>`;
}
function statusBadge(s){
  const map = {"NEW":"b-new","ACTION REQUIRED":"b-action","PROCESSING":"b-processing","WAITING":"b-waiting","COMPLETED":"b-completed","CANCELLED":"b-cancelled"};
  return `<span class="badge ${map[s]||'b-status'}">${esc(s)}</span>`;
}

/* =========================================================================

function setRoute(r){ route=r; renderNav(); renderApp(); window.scrollTo({top:0}); }

function renderNav(){
  $("#navlist").innerHTML = NAV.map((n,ix)=>`<li><button data-r="${n.id}" class="${route===n.id?'on':''}"><span class="ix">${String(ix).padStart(2,"0")}</span>${esc(n.label)}</button></li>`).join("");
  $$("#navlist button").forEach(b=> b.onclick = ()=> setRoute(b.dataset.r));

  const primary = MOBILE_PRIMARY.map(id=>NAV.find(n=>n.id===id));
  $("#bottomnav").innerHTML = primary.map(n=>`<button data-r="${n.id}" class="${route===n.id?'on':''}"><span class="dot"></span>${esc(n.label.split(" ")[0])}</button>`).join("")
    + `<button data-more="1" class="${['customers','quotations','delivery','reports'].includes(route)?'on':''}"><span class="dot"></span>More</button>`;
  $$("#bottomnav button[data-r]").forEach(b=> b.onclick = ()=> setRoute(b.dataset.r));
  $('#bottomnav button[data-more]').onclick = openMoreSheet;
}
function openMoreSheet(){
  const rest = NAV.filter(n=>!MOBILE_PRIMARY.includes(n.id));
  openModal("More", `<ul class="morelist">${rest.map(n=>`<button data-r="${n.id}">${esc(n.label)}</button>`).join("")}</ul>`, []);
  $$("#modalRoot .morelist button").forEach(b=> b.onclick = ()=>{ setRoute(b.dataset.r); closeModal(); });
}

function renderApp(){
  const titles = {dashboard:["Today","What needs your attention right now"], inbox:["Sales Inbox","Manually captured messages from WhatsApp, calls, email & visits"],

/* =========================================================================
   DASHBOARD
   ========================================================================= */
function renderDashboard(){
  const actions = buildActionQueue();
  const overdue = actions.filter(a=>isOverdue(a.dueDate,a.dueTime));
  const dueToday = actions.filter(a=> isToday(a.dueDate) && !isOverdue(a.dueDate,a.dueTime));

  const urgentActions = actions.filter(a=>a.priority==="Urgent").length;
  const followupsDueToday = DB.followups.filter(f=> isToday(f.dueDate) && f.status!=="COMPLETED").length;
  const pendingOrders = DB.orders.filter(o=>!["COMPLETED","CANCELLED","DELIVERED"].includes(o.status)).length;
  const pendingQuotes = DB.quotations.filter(q=>!["WON","LOST"].includes(q.status)).length;
  const pendingDeliveries = DB.orders.filter(o=> o.deliveryStatus && !["Delivered"].includes(o.deliveryStatus)).length;
  const paymentIssues = DB.orders.filter(o=> ["Payment Pending","Verification Pending","Overdue"].includes(o.paymentStatus)).length;
  const hotLeads = DB.customers.filter(c=>c.potential==="HOT").length + DB.followups.filter(f=>f.potential==="HOT" && f.status!=="COMPLETED").length;

  const stats = [
    ["urgent","🔴", urgentActions, "Urgent actions","dashboard"],
    ["warm","⏰", followupsDueToday, "Follow-ups due today","followups"],
    ["","🛒", pendingOrders, "Pending orders","orders"],
    ["","💰", pendingQuotes, "Pending quotations","quotations"],
    ["","📦", pendingDeliveries, "Pending deliveries","delivery"],
    ["urgent","💳", paymentIssues, "Payment issues","delivery"],
    ["ok","🔥", hotLeads, "Hot leads","followups"],
  ];

  const sortBy = dashSort || "due";
  const sorted = sortActions(actions, sortBy);

  return `
  <div class="cards">
    ${stats.map(s=>`<div class="stat ${s[0]}" data-goto="${s[4]}"><div class="n">${s[1]} ${s[2]}</div><div class="l">${s[3]}</div></div>`).join("")}
  </div>

  ${overdue.length? `<div class="overdue-banner">🚨 ${overdue.length} OVERDUE ACTION${overdue.length===1?"":"S"} — these needed attention before now</div>`:""}

  <div class="section-h">
    <h2>Today's actions</h2>
    <select id="dashSort" class="mono" style="border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff">
      <option value="due" ${sortBy==="due"?"selected":""}>Sort: Due time</option>
      <option value="priority" ${sortBy==="priority"?"selected":""}>Sort: Priority</option>
      <option value="customer" ${sortBy==="customer"?"selected":""}>Sort: Customer</option>
      <option value="type" ${sortBy==="type"?"selected":""}>Sort: Type</option>
    </select>
  </div>
  <div class="alist">
    ${sorted.length ? sorted.map(a=>actionCard(a)).join("") : `<div class="empty"><b>Nothing outstanding.</b><br>Capture something from WhatsApp or set a follow-up to see it here.</div>`}
  </div>`;
}
let dashSort = "due";

function actionCard(a){
  const overdue = isOverdue(a.dueDate,a.dueTime);
  const priClass = a.priority==="Urgent"?"pri-urgent":(a.priority==="Normal"?"pri-normal":"pri-low");
  const dueTxt = a.dueDate ? (isToday(a.dueDate)?`Today ${a.dueTime||""}`:fmtDateShort(a.dueDate)+" "+(a.dueTime||"")) : "No due date";
  return `<div class="acard ${priClass}">
    <div class="abody">
      <div class="arow1">
        <span class="cust">${esc(a.customer)}</span>
        ${priBadge(a.priority)}
        ${statusBadge(a.status)}
        ${overdue? `<span class="badge b-overdue">🚨 OVERDUE</span>`:""}
      </div>
      <div class="msg">${esc(a.text)}${a.reason? " — "+esc(a.reason):""}</div>
      <div class="meta"><span><b>Due:</b> ${esc(dueTxt)}</span><span><b>Source:</b> ${esc(a.source||"—")}</span></div>
      <div class="btns">
        ${a.kind==="inbox" ? `<button class="mini pri" data-act="inbox-process" data-id="${a.id}">Process</button>` : `<button class="mini pri" data-act="followup-open" data-id="${a.id}">Open</button>`}
        ${telLink(a.ref.phone)? `<a class="mini" href="${telLink(a.ref.phone)}">Call</a>` : ""}
        ${waLink(a.ref.phone)? `<a class="mini" href="${waLink(a.ref.phone)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
        <button class="mini" data-act="${a.kind}-complete" data-id="${a.id}">✓ Complete</button>
        <button class="mini" data-act="${a.kind}-reschedule" data-id="${a.id}">Reschedule</button>
      </div>
    </div>
  </div>`;
}

function renderInbox(){

  if(f.type && f.type!=="All"){
    if(f.type==="Urgent") list = list.filter(i=>i.priority==="Urgent");
    else list = list.filter(i=>i.type===f.type);
  }
  if(f.search){
    const q = f.search.toLowerCase();
    list = list.filter(i=> [i.customerName,i.phone,i.message,i.type].join(" ").toLowerCase().includes(q));
  }
  const counts = {};
  INBOX_STATUS.forEach(s=> counts[s] = DB.inbox.filter(i=>i.status===s).length);
  const overdueCount = DB.inbox.filter(i=> !["COMPLETED","CANCELLED"].includes(i.status) && isOverdue(i.dueDate,i.dueTime)).length;

  const typeChips = ["All","New Order","Price Request","Follow-up","Delivery","Payment","General","Urgent"];

  const created = new Date(i.createdAt);
  const canConvert = !i.convertedTo;
  return `<div class="acard ${priClass}">
    <div class="abody">
      <div class="arow1">
        <span class="badge b-status">${icon} ${esc(i.type.toUpperCase())}</span>
        ${priBadge(i.priority)}
        ${statusBadge(i.status)}

        <span><b>Next action:</b> ${esc(i.nextAction||"—")}</span>

}

/* =========================================================================
   REPORTS
   ========================================================================= */
function renderReports(){
  const today = todayISO();
  const weekAgo = new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const monthAgo = new Date(Date.now()-30*864e5).toISOString().slice(0,10);

  const actToday = DB.activities.filter(a=>a.date===today);
  const ordersToday = DB.orders.filter(o=>o.orderDate===today);
  const quotesToday = DB.quotations.filter(q=>q.dateSent===today);
  const salesToday = ordersToday.reduce((s,o)=>s+(Number(o.total)||0),0);
  const newCustToday = DB.customers.filter(c=> new Date(c.createdAt).toISOString().slice(0,10)===today).length;
  const fuDoneToday = DB.followups.filter(f=>f.status==="COMPLETED" && f.lastContact===today).length;

  const ordersWeek = DB.orders.filter(o=>o.orderDate>=weekAgo);
  const quotesWeek = DB.quotations.filter(q=>q.dateSent>=weekAgo);
  const won = quotesWeek.filter(q=>q.status==="WON").length, lost = quotesWeek.filter(q=>q.status==="LOST").length;
  const salesWeek = ordersWeek.reduce((s,o)=>s+(Number(o.total)||0),0);
  const visitsWeek = DB.activities.filter(a=>a.date>=weekAgo && a.type==="Customer Visit").length;
  const leadsWeek = DB.customers.filter(c=> new Date(c.createdAt).toISOString().slice(0,10)>=weekAgo).length;
  const fuWeek = DB.followups.filter(f=>f.status==="COMPLETED" && f.lastContact>=weekAgo).length;

  const ordersMonth = DB.orders.filter(o=>o.orderDate>=monthAgo);
  const salesMonth = ordersMonth.reduce((s,o)=>s+(Number(o.total)||0),0);
  const custByOrders = {};
  ordersMonth.forEach(o=>{ custByOrders[o.customerName]=(custByOrders[o.customerName]||0)+(Number(o.total)||0); });
  const topCustomers = Object.entries(custByOrders).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const prodCount = {};
  ordersMonth.forEach(o=>{ prodCount[o.product]=(prodCount[o.product]||0)+(Number(o.qty)||1); });
  const topProducts = Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const repeatCust = DB.customers.filter(c=> DB.orders.filter(o=>o.customerId===c.id).length>1).length;
  const quotesMonth = DB.quotations.filter(q=>q.dateSent>=monthAgo);
  const wonMonth = quotesMonth.filter(q=>q.status==="WON").length;
  const convMonth = quotesMonth.length? Math.round(wonMonth/quotesMonth.length*100):0;
  const pendingPayments = DB.orders.filter(o=>["Payment Pending","Verification Pending","Overdue"].includes(o.paymentStatus)).reduce((s,o)=>s+(Number(o.total)||0),0);

  const barMax = Math.max(1, ...topProducts.map(p=>p[1]));

  return `
  <div class="section-h"><h2>Today</h2></div>
  <div class="cards">
    <div class="stat"><div class="n">${actToday.filter(a=>a.type==="Customer Visit").length}</div><div class="l">Visits</div></div>
    <div class="stat"><div class="n">${actToday.filter(a=>a.type==="Phone Call").length}</div><div class="l">Calls</div></div>
    <div class="stat"><div class="n">${fuDoneToday}</div><div class="l">Follow-ups done</div></div>
    <div class="stat"><div class="n">${ordersToday.length}</div><div class="l">Orders</div></div>
    <div class="stat ok"><div class="n">${money(salesToday)}</div><div class="l">Sales value</div></div>
    <div class="stat"><div class="n">${newCustToday}</div><div class="l">New customers</div></div>
    <div class="stat"><div class="n">${quotesToday.length}</div><div class="l">Quotations</div></div>
  </div>

  <div class="section-h"><h2>This week</h2></div>
  <div class="cards">
    <div class="stat"><div class="n">${visitsWeek}</div><div class="l">Visits</div></div>
    <div class="stat"><div class="n">${leadsWeek}</div><div class="l">New leads</div></div>
    <div class="stat"><div class="n">${ordersWeek.length}</div><div class="l">Orders</div></div>
    <div class="stat ok"><div class="n">${money(salesWeek)}</div><div class="l">Sales</div></div>
    <div class="stat"><div class="n">${won}/${lost}</div><div class="l">Won / Lost</div></div>
    <div class="stat"><div class="n">${fuWeek}</div><div class="l">Follow-ups completed</div></div>
  </div>

  <div class="section-h"><h2>This month</h2></div>
  <div class="cards">
    <div class="stat ok"><div class="n">${money(salesMonth)}</div><div class="l">Total sales</div></div>
    <div class="stat"><div class="n">${ordersMonth.length}</div><div class="l">Orders</div></div>
    <div class="stat"><div class="n">${repeatCust}</div><div class="l">Repeat customers</div></div>
    <div class="stat"><div class="n">${convMonth}%</div><div class="l">Quotation conversion</div></div>
    <div class="stat urgent"><div class="n">${money(pendingPayments)}</div><div class="l">Pending payments</div></div>
  </div>

  <div class="two" style="margin-top:8px">
    <div>
      <div class="section-h" style="margin-top:0"><h2>Top customers (30d)</h2></div>
      <div class="tblwrap"><table><tbody>
        ${topCustomers.map(([n,v])=>`<tr><td>${esc(n)}</td><td style="text-align:right">${money(v)}</td></tr>`).join("") || `<tr><td style="padding:16px;color:var(--ink-3)">No order data yet.</td></tr>`}
      </tbody></table></div>
    </div>
    <div>
      <div class="section-h" style="margin-top:0"><h2>Top products (30d)</h2></div>
      <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)">
        ${topProducts.length? topProducts.map(([p,c])=>`
          <div style="margin-bottom:9px">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${esc(p)}</span><b>${c}</b></div>
            <div style="height:7px;background:var(--line-2);border-radius:5px;overflow:hidden"><div style="height:100%;width:${(c/barMax*100)}%;background:var(--accent)"></div></div>
          </div>`).join("") : `<div style="color:var(--ink-3);font-size:13px">No order data yet.</div>`}
      </div>
    </div>
  </div>`;
}

function customerPicker(fieldId, selId, selName){
  return `<div class="autoc">
    <input id="${fieldId}" placeholder="Type facility name…" value="${esc(selName||"")}" autocomplete="off" data-selid="${selId||""}">
    <div class="autoc-list" id="${fieldId}_list" hidden></div>
  </div>`;
}
function wireCustomerPicker(fieldId){
  const input = $("#"+fieldId), list = $("#"+fieldId+"_list");
  if(!input) return;
  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    input.dataset.selid = "";
    if(!q){ list.hidden=true; return; }
    const matches = DB.customers.filter(c=>c.name.toLowerCase().includes(q)).slice(0,6);
    list.innerHTML = matches.map(c=>`<div data-id="${c.id}" data-name="${esc(c.name)}">${esc(c.name)} <span style="color:var(--ink-3);font-size:11px">${esc(c.location||"")}</span></div>`).join("")
      + `<div data-newcust="1" style="color:var(--accent);font-weight:600">+ Add "${esc(input.value.trim())}" as new customer</div>`;
    list.hidden = false;
    $$("div",list).forEach(d=>d.onclick = ()=>{
      if(d.dataset.newcust){ input.dataset.selid=""; input.value = input.value.trim(); }
      else{ input.value = d.dataset.name; input.dataset.selid = d.dataset.id; }
      list.hidden = true;
    });
  });
  input.addEventListener("blur", ()=> setTimeout(()=>{ list.hidden = true; }, 150));
}
function resolveCustomerFromPicker(fieldId){
  const input = $("#"+fieldId);
  const selId = input.dataset.selid;
  if(selId){ const c = customerById(selId); if(c) return c; }
  const name = input.value.trim();
  if(!name) return null;
  return findOrCreateCustomer({name});
}

function convertInbox(id){
  const i = DB.inbox.find(x=>x.id===id); if(!i) return;
  const map = {"New Order":"order","Price Request":"quotation","Quotation":"quotation","Follow-up":"followup","Delivery":"order","Payment":"order","Lead":"followup"};
  const target = map[i.type] || "followup";
  if(target==="order"){
    const o = { id: uid("ORD"), customerId:i.customerId, customerName:i.customerName, contactPerson:"", product:"", brand:"",
      qty:"", unit:"", quotedPrice:"", finalPrice:"", total:"", orderDate:todayISO(), requiredDate:"", salesExec:DB.meta.salesExec,
      stockStatus:"", deliveryStatus:"Pending", paymentStatus:"Not Due", notes:i.message, source:i.source, status:"NEW ORDER", createdAt:Date.now() };
    DB.orders.unshift(o); i.convertedTo = "Order "+o.id; i.status="PROCESSING"; saveDB();
    addTimeline(i.customerId,"Order created",o.id); closeModal(); toast("Converted to order"); openOrderEdit(o.id);
  } else if(target==="quotation"){
    const q = { id: uid("QUO"), customerId:i.customerId, customerName:i.customerName, contact:"", products:"", qty:"",
      amount:"", dateSent:"", validUntil:"", source:i.source, followupDate:"", notes:i.message, status:"PRICE REQUEST", createdAt:Date.now() };
    DB.quotations.unshift(q); i.convertedTo = "Quote "+q.id; i.status="PROCESSING"; saveDB();
    addTimeline(i.customerId,"Quotation created",q.id); closeModal(); toast("Converted to quotation"); openQuoteEdit(q.id);
  } else {
    const f = { id: uid("FUP"), customerId:i.customerId, customerName:i.customerName, contactPerson:"", phone:i.phone, facility:"",
      requirement:i.message, product:"", lastContact:todayISO(), lastConversation:i.message, oppValue:"", potential:"WARM",
      relationship:"CONTACTED", nextAction:i.nextAction||"Call", dueDate:i.dueDate||todayISO(), dueTime:i.dueTime||"", notes:"", status:"ACTION REQUIRED", createdAt:Date.now() };
    DB.followups.unshift(f); i.convertedTo = "Follow-up "+f.id; i.status="PROCESSING"; saveDB();
    addTimeline(i.customerId,"Follow-up created",f.requirement.slice(0,60)); closeModal(); toast("Converted to follow-up"); openFollowupEdit(f.id);
  }
}

/* =========================================================================
   EVENT WIRING PER ROUTE
   ========================================================================= */
function wireRoute(){
  // dashboard stat -> goto
  $$("[data-goto]").forEach(el=> el.onclick = ()=> setRoute(el.dataset.goto));
  const sortSel = $("#dashSort"); if(sortSel) sortSel.onchange = ()=>{ dashSort = sortSel.value; renderApp(); };

  // action buttons (dashboard + inbox + followups all use data-act/data-id)
  $$("[data-act]").forEach(el=>{
    const act = el.dataset.act, id = el.dataset.id;
    if(act==="inbox-process" || act==="inbox-edit") el.onclick = ()=> openInboxEdit(id);
    else if(act==="inbox-convert") el.onclick = ()=> convertInbox(id);
    else if(act==="inbox-status-complete" || act==="inbox-complete") el.onclick = ()=>{ const i=DB.inbox.find(x=>x.id===id); if(i){ i.status="COMPLETED"; saveDB(); toast("Marked complete"); renderApp(); } };
    else if(act==="inbox-reschedule") el.onclick = ()=> openInboxEdit(id);
    else if(act==="inbox-more") el.onclick = ()=> openInboxEdit(id);
    else if(act==="followup-open" || act==="fu-edit") el.onclick = ()=> openFollowupEdit(id);
    else if(act==="fu-complete" || act==="followup-complete") el.onclick = ()=>{ const f=DB.followups.find(x=>x.id===id); if(f){ f.status="COMPLETED"; f.lastContact=todayISO(); saveDB(); toast("Marked complete"); renderApp(); } };
    else if(act==="fu-reschedule" || act==="followup-reschedule") el.onclick = ()=> openFollowupEdit(id);
    else if(act==="cust-open") el.onclick = ()=> openCustomerEdit(id);
    else if(act==="order-edit") el.onclick = ()=> openOrderEdit(id);
    else if(act==="quote-edit") el.onclick = ()=> openQuoteEdit(id);
  });

  // inbox route
  const chips = $("#inboxChips"); if(chips) $$(".fchip",chips).forEach(c=> c.onclick = ()=>{ filters.inbox.type = c.dataset.t; renderApp(); });
  const inboxSearch = $("#inboxSearch"); if(inboxSearch) inboxSearch.oninput = ()=>{ filters.inbox.search = inboxSearch.value; renderApp(); };
  const btnQC = $("#btnQuickCapture"); if(btnQC) btnQC.onclick = openQuickCapture;

  // followups route
  const fuChips = $$(".chiprow .fchip[data-p]"); fuChips.forEach(c=> c.onclick = ()=>{ filters.followups.potential = c.dataset.p; renderApp(); });
  const fuSearch = $("#fuSearch"); if(fuSearch) fuSearch.oninput = ()=>{ filters.followups.search = fuSearch.value; renderApp(); };
  const btnAddFu = $("#btnAddFollowup"); if(btnAddFu) btnAddFu.onclick = openFollowupNew;

  // customers route
  const custSearch = $("#custSearch"); if(custSearch) custSearch.oninput = ()=>{ filters.customers.search = custSearch.value; renderApp(); };
  const custType = $("#custTypeFilter"); if(custType) custType.onchange = ()=>{ filters.customers.type = custType.value; renderApp(); };
  const btnAddCust = $("#btnAddCustomer"); if(btnAddCust) btnAddCust.onclick = openCustomerNew;
  const expCust = $("#btnExportCustCSV"); if(expCust) expCust.onclick = ()=> exportCSV("customers", DB.customers, ["name","type","location","area","contactPerson","phone","whatsapp","email","potential","paymentBehaviour","lastVisit","lastOrder","nextFollowup"]);

  // orders route
  const ordSearch = $("#ordSearch"); if(ordSearch) ordSearch.oninput = ()=>{ filters.orders.search = ordSearch.value; renderApp(); };
  const ordStatus = $("#ordStatusFilter"); if(ordStatus) ordStatus.onchange = ()=>{ filters.orders.status = ordStatus.value; renderApp(); };
  const btnAddOrd = $("#btnAddOrder"); if(btnAddOrd) btnAddOrd.onclick = openOrderNew;
  const expOrd = $("#btnExportOrdCSV"); if(expOrd) expOrd.onclick = ()=> exportCSV("orders", DB.orders, ["id","customerName","product","brand","qty","unit","finalPrice","total","status","deliveryStatus","paymentStatus","orderDate","requiredDate"]);

  // quotations route
  const qSearch = $("#qSearch"); if(qSearch) qSearch.oninput = ()=>{ filters.quotations.search = qSearch.value; renderApp(); };
  const qStatus = $("#qStatusFilter"); if(qStatus) qStatus.onchange = ()=>{ filters.quotations.status = qStatus.value; renderApp(); };
  const btnAddQ = $("#btnAddQuote"); if(btnAddQ) btnAddQ.onclick = openQuoteNew;
  const expQ = $("#btnExportQuoteCSV"); if(expQ) expQ.onclick = ()=> exportCSV("quotations", DB.quotations, ["id","customerName","products","qty","amount","status","dateSent","validUntil","followupDate"]);

  // delivery route inline selects
  $$(".inlineSel").forEach(sel=> sel.onchange = ()=>{
    const o = DB.orders.find(x=>x.id===sel.dataset.order); if(!o) return;
    o[sel.dataset.field] = sel.value; saveDB(); toast("Updated"); renderApp();
  });
}

/* =========================================================================
   GLOBAL SEARCH
   ========================================================================= */
$("#globalSearch").addEventListener("input", (e)=>{
  const q = e.target.value.trim();
  if(q.length<2) return;
  clearTimeout(window._gsT);
  window._gsT = setTimeout(()=> runGlobalSearch(q), 250);
});
function runGlobalSearch(q){
  const ql = q.toLowerCase();
  const hitsCust = DB.customers.filter(c=>[c.name,c.phone,c.contactPerson].join(" ").toLowerCase().includes(ql));
  const hitsOrd = DB.orders.filter(o=>[o.id,o.customerName,o.product].join(" ").toLowerCase().includes(ql));
  const hitsQuo = DB.quotations.filter(q2=>[q2.id,q2.customerName,q2.products].join(" ").toLowerCase().includes(ql));
  const hitsInb = DB.inbox.filter(i=>[i.customerName,i.message,i.phone].join(" ").toLowerCase().includes(ql));
  const body = `
    ${hitsCust.length? `<h4 style="font-size:12.5px;color:var(--ink-3);margin:10px 0 6px">CUSTOMERS</h4>` + hitsCust.slice(0,5).map(c=>`<div class="mini" style="display:block;margin-bottom:5px;cursor:pointer" data-c="${c.id}">${esc(c.name)}</div>`).join("") : ""}
    ${hitsOrd.length? `<h4 style="font-size:12.5px;color:var(--ink-3);margin:10px 0 6px">ORDERS</h4>` + hitsOrd.slice(0,5).map(o=>`<div class="mini" style="display:block;margin-bottom:5px;cursor:pointer" data-o="${o.id}">${esc(o.id)} — ${esc(o.customerName)} · ${esc(o.product)}</div>`).join("") : ""}
    ${hitsQuo.length? `<h4 style="font-size:12.5px;color:var(--ink-3);margin:10px 0 6px">QUOTATIONS</h4>` + hitsQuo.slice(0,5).map(q2=>`<div class="mini" style="display:block;margin-bottom:5px;cursor:pointer" data-q="${q2.id}">${esc(q2.id)} — ${esc(q2.customerName)}</div>`).join("") : ""}
    ${hitsInb.length? `<h4 style="font-size:12.5px;color:var(--ink-3);margin:10px 0 6px">INBOX</h4>` + hitsInb.slice(0,5).map(i=>`<div class="mini" style="display:block;margin-bottom:5px;cursor:pointer" data-i="${i.id}">${esc(i.customerName)} — ${esc(i.message.slice(0,50))}</div>`).join("") : ""}
    ${!hitsCust.length && !hitsOrd.length && !hitsQuo.length && !hitsInb.length ? `<div style="color:var(--ink-3);padding:10px 0">No matches for "${esc(q)}".</div>` : ""}
  `;
  openModal("Search results", body, [{label:"Close", cls:"ghost", onClick: closeModal}]);
  $$("[data-c]").forEach(el=> el.onclick = ()=>{ closeModal(); setRoute("customers"); setTimeout(()=>openCustomerEdit(el.dataset.c),200); });
  $$("[data-o]").forEach(el=> el.onclick = ()=>{ closeModal(); setRoute("orders"); setTimeout(()=>openOrderEdit(el.dataset.o),200); });
  $$("[data-q]").forEach(el=> el.onclick = ()=>{ closeModal(); setRoute("quotations"); setTimeout(()=>openQuoteEdit(el.dataset.q),200); });
  $$("[data-i]").forEach(el=> el.onclick = ()=>{ closeModal(); setRoute("inbox"); setTimeout(()=>openInboxEdit(el.dataset.i),200); });
}

/* =========================================================================
   EXPORT / IMPORT
   ========================================================================= */
function download(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportCSV(name, rows, cols){
  if(!rows.length){ toast("Nothing to export yet"); return; }
  const esc2 = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const lines = [cols.join(",")].concat(rows.map(r=> cols.map(c=>esc2(r[c])).join(",")));
  download(name+"_"+todayISO()+".csv", lines.join("\n"), "text/csv");
  toast("CSV exported");
}
$("#btnExportJSON").onclick = ()=>{
  download("fielddesk_backup_"+todayISO()+".json", JSON.stringify(DB,null,2), "application/json");
  toast("Backup exported");
};
$("#btnImportJSON").onclick = ()=> $("#fileImport").click();
$("#fileImport").onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm("Import this backup? It will replace all current data in this browser.")) return;
      DB = Object.assign(blankDB(), data);
      saveDB(); toast("Backup imported"); renderApp();
    }catch(err){ toast("Could not read that file — is it a valid backup?"); }
  };
  reader.readAsText(file);
  e.target.value = "";
};

   TOP BAR / FAB
   ========================================================================= */
$("#btnQuickCaptureTop").onclick = openQuickCapture;
$("#fabCapture").onclick = openQuickCapture;

/* =========================================================================
   INIT
   ========================================================================= */
renderNav();
renderApp();
